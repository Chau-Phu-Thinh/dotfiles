font_size 15.0
# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
#
# ─── Window ───────────────────────────────────────────────────────────────────
hide_window_decorations yes
window_padding_width  12 12
background_opacity 0.88
# ghostty: background-blur-radius = 25
# kitty on wayland: set blur via compositor (e.g. niri windowrule blur)
background_blur 1

cursor_shape block
cursor_blink_interval -1

# ─── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines 3023

# ─── Mouse ────────────────────────────────────────────────────────────────────
mouse_hide_wait 0
copy_on_select no

# ─── Close behavior ───────────────────────────────────────────────────────────
confirm_os_window_close 0

# ─── Shell integration ────────────────────────────────────────────────────────
shell_integration enabled

# ─── Tab bar ──────────────────────────────────────────────────────────────────
tab_bar_style powerline
tab_bar_edge bottom

# ─── Inactive split / window dimming ──────────────────────────────────────────
inactive_text_alpha 0.7


# ─── Key Bindings ─────────────────────────────────────────────────────────────
map ctrl+shift+o launch --location=vsplit
map ctrl+shift+e layout --location=hsplit
map ctrl+t       new_tab
map ctrl+w       close_tab
map ctrl+equal   change_font_size all +1.0
map ctrl+plus    change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0
map shift+enter  send_text all \n
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map ctrl+/ command_palette

# ─── Theme ────────────────────────────────────────────────────────────────────
# BEGIN_KITTY_THEME
include dark-theme.auto.conf
# END_KITTY_THEME
